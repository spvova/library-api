services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://rest_lab2:rest_lab2@db:5432/rest_lab2
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine  # Оновлено до 16 версії
    environment:
      - POSTGRES_USER=rest_lab2
      - POSTGRES_PASSWORD=rest_lab2
      - POSTGRES_DB=rest_lab2
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rest_lab2 -d rest_lab2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: