[project]
name = "library-api"
version = "0.1.0"
description = "Library API with MongoDB and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.3",
    "uvicorn[standard]>=0.46.0",
    "motor>=3.7.1",
    "pyjwt>=2.8.1",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
]

