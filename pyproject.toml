[project]
name = "library-api"
version = "0.1.0"
description = "Library API with FastAPI and MongoDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.3",
    "uvicorn[standard]>=0.46.0",
    "motor>=3.7.1",
    "pydantic-mongo>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]
